name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests and Debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Match KLEIDIAI_COMMIT_TAG in llama.cpp/ggml/src/ggml-cpu/CMakeLists.txt.
      - name: Check out KleidiAI v1.24.0 for the native build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ARM-software/kleidiai
          ref: 0b2ee513397578a272a4e8a6c12589ef6534371c # v1.24.0
          path: build/ci-deps/kleidiai
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrappers and set up caching
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Install Android SDK packages
        shell: bash
        run: |
          # Keep the SDK platform, NDK and CMake aligned with app/build.gradle.kts.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" --install \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Run Standard unit tests
        run: bash ./gradlew --no-daemon --stacktrace --max-workers=2 :app:testStandardDebugUnitTest

      - name: Build Standard and QNN Debug APKs
        run: |
          bash ./gradlew --no-daemon --stacktrace --max-workers=2 \
            -PkleidiaiSourceDir="$GITHUB_WORKSPACE/build/ci-deps/kleidiai" \
            :app:assembleStandardDebug :app:assembleQnnDebug

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unit-tests
          path: |
            app/build/reports/tests/testStandardDebugUnitTest/
            app/build/test-results/testStandardDebugUnitTest/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 7

      # Compile both flavors on pull requests, but only store the large APKs for push/manual runs.
      - name: Upload Standard Debug APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TsumugiSub-standard-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

      - name: Upload QNN Debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TsumugiSub-qnn-debug-arm64-v8a
          path: app/build/outputs/apk/qnn/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
